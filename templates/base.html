<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ page_title or 'Placement Portal' }}</title>
	<style>
		:root {
			--bg: #eef3ff;
			--card: #ffffff;
			--text: #172033;
			--muted: #667085;
			--primary: #2457d6;
			--primary-dark: #1d46ad;
			--border: #d8e0ef;
			--soft: #f6f8ff;
			--success: #0f7a49;
			--error: #b42318;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Arial, Helvetica, sans-serif;
			background: linear-gradient(135deg, #e8efff 0%, #f7f9ff 45%, #edf3ff 100%);
			color: var(--text);
			padding: 24px;
		}

		.shell {
			max-width: 1180px;
			margin: 0 auto;
			display: grid;
			gap: 18px;
		}

		.navbar, .content-card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 22px;
			box-shadow: 0 20px 50px rgba(36, 87, 214, 0.12);
		}

		.navbar {
			padding: 16px 20px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			flex-wrap: wrap;
		}

		.brand {
			font-weight: 800;
			color: var(--primary-dark);
			text-decoration: none;
		}

		.navlinks {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		.navlinks a {
			padding: 10px 14px;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 700;
			font-size: 0.95rem;
			background: var(--soft);
			color: var(--primary-dark);
		}

		.content-card {
			padding: 24px;
		}

		.flash {
			padding: 12px 14px;
			border-radius: 12px;
			font-weight: 700;
			margin-bottom: 16px;
		}

		.flash.success { background: #ecfdf3; color: var(--success); }
		.flash.error { background: #fef3f2; color: var(--error); }
		.flash.info { background: #eff6ff; color: var(--primary-dark); }

		.button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 12px 16px;
			border-radius: 12px;
			border: 0;
			background: var(--primary);
			color: #fff;
			text-decoration: none;
			font-weight: 700;
			cursor: pointer;
		}

		.button.secondary {
			background: #dbe4f4;
			color: var(--primary-dark);
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 16px;
		}

		.panel {
			padding: 18px;
			border-radius: 18px;
			background: var(--soft);
			border: 1px solid var(--border);
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th, td {
			text-align: left;
			padding: 10px 8px;
			border-bottom: 1px solid var(--border);
			vertical-align: top;
		}

		.muted { color: var(--muted); }
	</style>
</head>
<body>
	<div class="shell">
		<header class="navbar">
			<a class="brand" href="{{ url_for('auth.home') }}">Placement Portal</a>
			<div class="navlinks">
				<a href="{{ url_for('auth.register') }}">Register</a>
				<a href="{{ url_for('auth.login') }}">Login</a>
				{% if current_user %}
				<a href="{{ url_for('dashboard.role_redirect') }}">My Dashboard</a>
				<a href="{{ url_for('auth.logout') }}">Logout</a>
				{% endif %}
			</div>
		</header>

		<main class="content-card">
			{% with messages = get_flashed_messages(with_categories=true) %}
				{% if messages %}
					{% for category, message in messages %}
						<div class="flash {{ category }}">{{ message }}</div>
					{% endfor %}
				{% endif %}
			{% endwith %}
			{% block content %}{% endblock %}
		</main>
	</div>
</body>
</html>
